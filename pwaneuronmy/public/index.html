<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Neuron Sample App</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f8fafc;
        color: #0f172a;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        max-width: 440px;
        width: 100%;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.35rem;
      }
      p {
        margin: 0 0 16px;
        color: #475569;
        line-height: 1.5;
        font-size: 0.94rem;
      }
      .stat-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
      }
      .stat {
        background: #f1f5f9;
        border-radius: 12px;
        padding: 14px;
      }
      .stat-label {
        font-size: 0.78rem;
        color: #64748b;
      }
      .stat-value {
        margin-top: 4px;
        font-size: 1.25rem;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Neuron Sample App</h1>
      <p>
        This is a plain web app with <strong>no PWA manifest, no service worker, and no push code</strong>.
        It simulates an upstream site you don't have source-code access to.
      </p>
      <div class="stat-grid">
        <div class="stat">
          <div class="stat-label">Status</div>
          <div class="stat-value">Online</div>
        </div>
        <div class="stat">
          <div class="stat-label">PWA Support</div>
          <div class="stat-value">None</div>
        </div>
      </div>
    </main>
  </body>
</html>
